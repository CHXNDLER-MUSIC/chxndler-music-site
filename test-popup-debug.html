<!DOCTYPE html>
<html>
<head>
    <title>Test Popup Debug</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #000; color: #00FFFF; }
        .debug { margin: 10px 0; padding: 10px; background: rgba(0,255,255,0.1); border-radius: 5px; }
        button { padding: 10px 20px; background: rgba(0,255,255,0.2); border: 1px solid #00FFFF; color: #00FFFF; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>Test Name Popup Flow</h1>
    
    <div class="debug">
        <h3>Current URL:</h3>
        <p id="currentUrl"></p>
    </div>
    
    <div class="debug">
        <h3>URL Parameters:</h3>
        <p id="urlParams"></p>
    </div>
    
    <button onclick="testCompleteProfile()">Test with ?completeProfile=1</button>
    <button onclick="testNormal()">Test Normal Load</button>
    <button onclick="clearUrl()">Clear URL</button>
    
    <div class="debug">
        <h3>Debug Log:</h3>
        <div id="debugLog"></div>
    </div>

    <script>
        function updateDebugInfo() {
            document.getElementById('currentUrl').textContent = window.location.href;
            document.getElementById('urlParams').textContent = window.location.search || 'None';
        }
        
        function log(message) {
            const logDiv = document.getElementById('debugLog');
            logDiv.innerHTML += '<p>' + new Date().toLocaleTimeString() + ': ' + message + '</p>';
        }
        
        function testCompleteProfile() {
            log('Setting URL to ?completeProfile=1');
            window.location.href = window.location.pathname + '?completeProfile=1';
        }
        
        function testNormal() {
            log('Setting URL to normal (no params)');
            window.location.href = window.location.pathname;
        }
        
        function clearUrl() {
            log('Clearing URL parameters');
            window.history.replaceState({}, '', window.location.pathname);
            updateDebugInfo();
        }
        
        // Initial update
        updateDebugInfo();
        
        // Log when page loads
        log('Test page loaded');
        
        // Check for completeProfile parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('completeProfile') === '1') {
            log('🎯 Found completeProfile=1 in URL!');
        } else {
            log('No completeProfile parameter found');
        }
    </script>
</body>
</html>
